<svg xmlns="http://www.w3.org/2000/svg" width="180" height="54" viewBox="0 0 180 54">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B2D8B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3182CE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.25" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#009624;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="180" height="54" rx="6" ry="6" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="180" height="27" rx="6" ry="6" fill="url(#shine)"/>
  <rect x="0" y="27" width="180" height="27" fill="url(#shine)"/>
  <polygon points="8,12 16,26 0,26" fill="url(#triGrad)" filter="url(#shadow)"/>
  <polygon points="8,14 14,24 2,24" fill="#00E676" opacity="0.5"/>
  <text x="24" y="22" font-family="Segoe UI,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" filter="url(#textGlow)">Ренессанс.</text>
  <text x="24" y="36" font-family="Segoe UI,sans-serif" font-size="9" font-weight="600" fill="#FFFFFF" opacity="0.9" filter="url(#textGlow)">СТРАХОВАНИЕ</text>
  <rect x="0" y="0" width="180" height="54" rx="6" ry="6" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.5"/>
</svg>
